<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventBooker — Панель управления</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

<!-- Навигация -->
<nav class="border-b border-slate-800 bg-slate-950/50 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-indigo-600 rounded-lg">
                <i class="fa-solid fa-ticket text-xl text-white"></i>
            </div>
            <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
                    EventBooker
                </span>
        </div>
        <div class="flex items-center space-x-4">
                <span id="activeUserBadge" class="text-xs bg-slate-800 border border-slate-700 text-slate-400 px-3 py-1.5 rounded-full">
                    Пользователь не выбран
                </span>
        </div>
    </div>
</nav>

<!-- Основной контент -->
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-10">

    <!-- Верхний блок: Экспресс-действия (Создание) -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- Форма регистрации пользователя -->
        <div class="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-6 shadow-xl backdrop-blur">
            <h2 class="text-lg font-semibold mb-4 flex items-center gap-2 text-indigo-400">
                <i class="fa-solid fa-user-plus"></i> Новый пользователь
            </h2>
            <form id="createUserForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Email</label>
                    <input type="email" id="userEmail" required placeholder="alex@example.com"
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Telegram</label>
                    <input type="text" id="userTelegram" placeholder="@username"
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition">
                </div>
                <button type="submit"
                        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl text-sm transition shadow-lg shadow-indigo-600/20">
                    Зарегистрировать
                </button>
            </form>
        </div>

        <!-- Форма создания ивента -->
        <div class="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-6 shadow-xl backdrop-blur">
            <h2 class="text-lg font-semibold mb-4 flex items-center gap-2 text-cyan-400">
                <i class="fa-solid fa-calendar-plus"></i> Новое мероприятие
            </h2>
            <form id="createEventForm" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="sm:col-span-2">
                        <label class="block text-xs font-medium text-slate-400 mb-1">Название</label>
                        <input type="text" id="eventTitle" required placeholder="Go Tech Meetup"
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Всего мест</label>
                        <input type="number" id="eventSeats" required min="1" value="50"
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">TTL брони (мин)</label>
                        <input type="number" id="eventTTL" required min="1" value="15"
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 transition">
                    </div>
                    <div class="sm:col-span-2">
                        <label class="block text-xs font-medium text-slate-400 mb-1">Дата и время</label>
                        <input type="datetime-local" id="eventDate" required
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 transition">
                    </div>
                </div>
                <button type="submit"
                        class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2.5 rounded-xl text-sm transition shadow-lg shadow-cyan-600/20">
                    Создать ивент
                </button>
            </form>
        </div>

    </div>

    <!-- Секция: Доступные мероприятия -->
    <section class="space-y-4">
        <div class="flex justify-between items-center">
            <h2 class="text-xl font-bold tracking-tight flex items-center gap-2">
                <i class="fa-solid fa-fire text-amber-500"></i> Предстоящие мероприятия
            </h2>
            <button onclick="loadEvents()" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg text-slate-300 transition">
                <i class="fa-solid fa-rotate-right mr-1"></i> Обновить
            </button>
        </div>

        <div id="eventsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Карточки ивентов рендерятся через JS -->
            <div class="col-span-full text-center py-12 text-slate-500">Загрузка мероприятий...</div>
        </div>
    </section>

    <!-- Секция: Бронирования текущего пользователя -->
    <section class="space-y-4">
        <div class="flex justify-between items-center">
            <h2 class="text-xl font-bold tracking-tight flex items-center gap-2">
                <i class="fa-solid fa-bookmark text-indigo-400"></i> Мои бронирования
            </h2>
        </div>

        <div class="bg-slate-800/30 border border-slate-700/50 rounded-2xl overflow-hidden backdrop-blur">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-400">
                    <thead class="bg-slate-800/80 text-xs uppercase tracking-wider text-slate-300 border-b border-slate-700">
                    <tr>
                        <th class="p-4">ID Брони</th>
                        <th class="p-4">Статус</th>
                        <th class="p-4">Истекает через</th>
                        <th class="p-4 text-right">Действия</th>
                    </tr>
                    </thead>
                    <tbody id="bookingsTable" class="divide-y divide-slate-800">
                    <tr>
                        <td colspan="4" class="p-8 text-center text-slate-500">
                            Зарегистрируйтесь или укажите ID пользователя для просмотра броней.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

</main>

<!-- Скрипт логики приложения -->
<script>
    const API_BASE = '/api/v1';
    let currentUserId = localStorage.getItem('eventbooker_user_id') || null;

    document.addEventListener('DOMContentLoaded', () => {
        if (currentUserId) updateActiveUserBadge(currentUserId);
        loadEvents();
        if (currentUserId) loadUserBookings();

        // Автообновление каждые 10 секунд (для сбора актуальных статусов и мест)
        setInterval(() => {
            loadEvents();
            if (currentUserId) loadUserBookings();
        }, 10000);
    });

    // 1. Создание пользователя
    document.getElementById('createUserForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('userEmail').value;
        const telegram_use = document.getElementById('userTelegram').value;

        try {
            const res = await fetch(`${API_BASE}/users`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, telegram_use })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Ошибка создания');

            currentUserId = data.id;
            localStorage.setItem('eventbooker_user_id', currentUserId);
            updateActiveUserBadge(currentUserId);
            alert(`Пользователь создан! ID: ${data.id}`);
            e.target.reset();
            loadUserBookings();
        } catch (err) {
            alert(err.message);
        }
    });

    // 2. Создание события
    document.getElementById('createEventForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = document.getElementById('eventTitle').value;
        const total_seats = parseInt(document.getElementById('eventSeats').value);
        const booking_ttl_minutes = parseInt(document.getElementById('eventTTL').value);
        const event_date = new Date(document.getElementById('eventDate').value).toISOString();

        try {
            const res = await fetch(`${API_BASE}/events`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, total_seats, booking_ttl_minutes, event_date })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Ошибка создания события');

            e.target.reset();
            loadEvents();
        } catch (err) {
            alert(err.message);
        }
    });

    // 3. Загрузка мероприятий
    async function loadEvents() {
        try {
            const res = await fetch(`${API_BASE}/events`);
            const events = await res.json();
            const container = document.getElementById('eventsList');

            if (!events || events.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-8 text-slate-500">Нет доступных мероприятий</div>`;
                return;
            }

            container.innerHTML = events.map(ev => `
                    <div class="bg-slate-800/40 border border-slate-700/60 rounded-2xl p-5 flex flex-col justify-between hover:border-slate-600 transition shadow-lg">
                        <div class="space-y-3">
                            <div class="flex justify-between items-start">
                                <h3 class="font-bold text-lg text-slate-100">${escapeHtml(ev.title)}</h3>
                                <span class="text-xs px-2.5 py-1 rounded-full font-medium ${ev.available_seats > 0 ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'}">
                                    ${ev.available_seats} / ${ev.total_seats} мест
                                </span>
                            </div>
                            <div class="text-xs text-slate-400 space-y-1">
                                <p><i class="fa-regular fa-clock mr-1.5"></i>${new Date(ev.event_date).toLocaleString()}</p>
                                <p><i class="fa-solid fa-hourglass-half mr-1.5"></i>TTL брони: ${ev.booking_ttl_minutes} мин</p>
                            </div>
                        </div>
                        <button onclick="bookSeat('${ev.id}')" ${ev.available_seats === 0 ? 'disabled' : ''}
                            class="mt-5 w-full bg-indigo-600/80 hover:bg-indigo-600 disabled:bg-slate-800 disabled:text-slate-600 text-white font-medium py-2 rounded-xl text-sm transition">
                            ${ev.available_seats > 0 ? 'Забронировать место' : 'Мест нет'}
                        </button>
                    </div>
                `).join('');
        } catch (err) {
            console.error('Ошибка загрузки ивентов:', err);
        }
    }

    // 4. Бронирование места
    async function bookSeat(eventId) {
        if (!currentUserId) {
            alert('Сначала зарегистрируйте пользователя!');
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/events/${eventId}/book`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: currentUserId })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Ошибка бронирования');

            loadEvents();
            loadUserBookings();
        } catch (err) {
            alert(err.message);
        }
    }

    // 5. Загрузка броней пользователя
    async function loadUserBookings() {
        if (!currentUserId) return;

        try {
            const res = await fetch(`${API_BASE}/users/${currentUserId}/bookings`);
            const bookings = await res.json();
            const tbody = document.getElementById('bookingsTable');

            if (!bookings || bookings.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-slate-500">У вас пока нет активных броней</td></tr>`;
                return;
            }

            tbody.innerHTML = bookings.map(b => {
                const statusBadge = getStatusBadge(b.status);
                const isPending = b.status === 'pending';

                return `
                        <tr class="hover:bg-slate-800/30 transition">
                            <td class="p-4 font-mono text-xs text-slate-300">${b.id}</td>
                            <td class="p-4">${statusBadge}</td>
                            <td class="p-4 font-mono text-xs text-slate-400">${isPending ? formatTTL(b.expires_at) : '-'}</td>
                            <td class="p-4 text-right space-x-2">
                                ${isPending ? `
                                    <button onclick="confirmBooking('${b.id}')" class="bg-emerald-600/20 hover:bg-emerald-600/40 text-emerald-300 border border-emerald-500/30 px-3 py-1 rounded-lg text-xs transition">Подтвердить</button>
                                    <button onclick="cancelBooking('${b.id}')" class="bg-rose-600/20 hover:bg-rose-600/40 text-rose-300 border border-rose-500/30 px-3 py-1 rounded-lg text-xs transition">Отменить</button>
                                ` : '<span class="text-slate-600 text-xs">Завершено</span>'}
                            </td>
                        </tr>
                    `;
            }).join('');
        } catch (err) {
            console.error('Ошибка загрузки броней:', err);
        }
    }

    // 6. Подтверждение и отмена брони
    async function confirmBooking(id) {
        await fetch(`${API_BASE}/bookings/${id}/confirm`, { method: 'POST' });
        loadEvents();
        loadUserBookings();
    }

    async function cancelBooking(id) {
        await fetch(`${API_BASE}/bookings/${id}/cancel`, { method: 'POST' });
        loadEvents();
        loadUserBookings();
    }

    // Вспомогательные функции
    function updateActiveUserBadge(id) {
        document.getElementById('activeUserBadge').innerText = `User ID: ${id.substring(0, 8)}...`;
        document.getElementById('activeUserBadge').classList.replace('text-slate-400', 'text-indigo-400');
    }

    function getStatusBadge(status) {
        switch(status) {
            case 'pending': return `<span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2.5 py-1 rounded-full text-xs font-medium"><i class="fa-regular fa-clock mr-1"></i>Pending</span>`;
            case 'confirmed': return `<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-full text-xs font-medium"><i class="fa-solid fa-check mr-1"></i>Confirmed</span>`;
            case 'cancelled': return `<span class="bg-rose-500/10 text-rose-400 border border-rose-500/20 px-2.5 py-1 rounded-full text-xs font-medium"><i class="fa-solid fa-xmark mr-1"></i>Cancelled</span>`;
            default: return status;
        }
    }

    function formatTTL(expiresAt) {
        const diff = new Date(expiresAt) - new Date();
        if (diff <= 0) return 'Истекло';
        const mins = Math.floor(diff / 60000);
        const secs = Math.floor((diff % 60000) / 1000);
        return `${mins}м ${secs}с`;
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>
</body>
</html>
